name: Build ViPN for Windows

on:
  workflow_dispatch:

env:
  QT_VERSION: '6.10.1'
  QT_DESKTOP_MODULES: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets qtimageformats'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_DESKTOP_MODULES }}
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install "conan==2.28.0"
      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows client and installers
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: deploy\build.bat --installer all
      - uses: actions/upload-artifact@v4
        with:
          name: vipn-windows
          path: |
            deploy/build/ViPN_*_windows_x64.exe
            deploy/build/ViPN_*_windows_x64.msi
          if-no-files-found: error
