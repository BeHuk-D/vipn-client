name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '6.10.1'
  QT_DESKTOP_MODULES: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets qtimageformats'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_DESKTOP_MODULES }}
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install "conan==2.28.0"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev
      - name: Build Linux client and installer
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIAVPN_VERSION: ${{ needs.version.outputs.value }}
        run: deploy/build.sh --generator Ninja --installer all
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: deploy/build/ViPN_*_linux_x64.run
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_DESKTOP_MODULES }}
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install "conan==2.28.0"
      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows client and installers
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIAVPN_VERSION: ${{ needs.version.outputs.value }}
        run: deploy\build.bat --installer all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            deploy/build/ViPN_*_windows_x64.exe
            deploy/build/ViPN_*_windows_x64.msi
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ViPN ${{ needs.version.outputs.value }}" \
            --notes "ViPN ${{ needs.version.outputs.value }}" \
            dist/linux-installer/*.run \
            dist/windows-installer/*.exe \
            dist/windows-installer/*.msi
