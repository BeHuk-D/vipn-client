name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '6.10.1'
  QT_DESKTOP_MODULES: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets qtimageformats'
  QT_ANDROID_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_DESKTOP_MODULES }}
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install "conan==2.28.0"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev
      - name: Build Linux client and installer
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIAVPN_VERSION: ${{ needs.version.outputs.value }}
        run: deploy/build.sh --generator Ninja --installer all
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: deploy/build/ViPN_*_linux_x64.run
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_DESKTOP_MODULES }}
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install "conan==2.28.0"
      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows client and installers
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIAVPN_VERSION: ${{ needs.version.outputs.value }}
        run: deploy\build.bat --installer all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            deploy/build/ViPN_*_windows_x64.exe
            deploy/build/ViPN_*_windows_x64.msi
          if-no-files-found: error

  android:
    name: Android
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_armv7
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;36.0.0 ndk;27.0.11718014"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pip install "conan==2.28.0"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vipn-release.jks"
      - name: Build signed APK
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIAVPN_VERSION: ${{ needs.version.outputs.value }}
          ANDROID_PLATFORM: android-35
          APP_ANDROID_MIN_SDK: '28'
          QT_ANDROID_SIGN_APK: 'ON'
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vipn-release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          deploy/build.sh -t android \
            --abi arm64-v8a --abi armeabi-v7a --abi x86_64
      - name: Collect APKs
        run: |
          mkdir -p dist/android
          cp deploy/build/client/android-build/build/outputs/apk/*.apk dist/android/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ViPN ${{ needs.version.outputs.value }}" \
            --notes "ViPN ${{ needs.version.outputs.value }}" \
            dist/linux-installer/*.run \
            dist/windows-installer/*.exe \
            dist/windows-installer/*.msi \
            dist/android-apk/*.apk
